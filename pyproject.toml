[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docdicer"
dynamic = ["version"]
description = "A simple, stdlib-only monolithic -> hierarchy markdown tool for agent context efficiency"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
docdicer = "docdicer.__main__:main"

[tool.setuptools.packages.find]
exclude = ["docdicer.test", "docdicer.test.*"]

[tool.setuptools.dynamic]
version = { attr = "docdicer.__version__" }
